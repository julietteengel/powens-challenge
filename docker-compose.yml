services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: webhooks
    ports:
      - "55432:5432" # non-default host port: 5432/5433 are both common local Postgres ports already; this one isn't
    volumes:
      - ./migrations/001_jobs.up.sql:/docker-entrypoint-initdb.d/001_jobs.up.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: dispatcher
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/webhooks?sslmode=disable
      HMAC_SECRET: ${HMAC_SECRET}
      WORKER_CONCURRENCY: "10"
      ADDR: ":8080"
    ports:
      - "8080:8080"
    stop_grace_period: 30s

  testreceiver:
    build:
      context: .
      target: testreceiver
    environment:
      HMAC_SECRET: ${HMAC_SECRET}
      ADDR: ":9000"
    ports:
      - "9000:9000"
